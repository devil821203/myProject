<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Auto Skipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <div class="app-logo" aria-hidden="true">▶</div>
      <div>
        <h1>YouTube Auto Skipper</h1>
        <p class="app-subtitle user-only">自動幫你點擊 YouTube 的「略過廣告」按鈕</p>
        <p class="app-subtitle developer-only">Chrome DevTools Protocol 開發者控制台</p>
      </div>
      <span id="modeBadge" class="mode-badge developer-only"></span>
    </header>

    <section class="card primary-card">
      <label class="switch-row" for="enabledToggle">
        <span>
          <strong>自動略過廣告</strong>
          <small id="enabledDescription">功能啟用後會自動偵測可略過的廣告</small>
        </span>
        <span class="switch-control">
          <input id="enabledToggle" type="checkbox">
          <span class="switch-slider" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <section class="card user-only">
      <div class="user-status-header">
        <div id="userStatusIcon" class="status-icon">…</div>
        <div>
          <h2 id="userStatusTitle">正在讀取狀態</h2>
          <p id="userStatusMessage">請稍候</p>
        </div>
      </div>

      <div class="summary-grid">
        <div class="summary-item">
          <span>已略過</span>
          <strong><span id="userSkipCount">0</span> 次</strong>
        </div>
        <div class="summary-item">
          <span>目前分頁</span>
          <strong id="userTabStatus">檢查中</strong>
        </div>
      </div>

      <p id="userLastSkipAt" class="user-last-skip"></p>

      <button id="userRefreshButton" class="secondary">立即重新偵測</button>
    </section>

    <section class="card developer-only">
      <h2>目前狀態</h2>
      <div class="status-row"><span>YouTube 分頁</span><strong id="youtubeStatus">讀取中</strong></div>
      <div class="status-row"><span>播放器</span><strong id="playerStatus">讀取中</strong></div>
      <div class="status-row"><span>廣告播放中</span><strong id="adStatus">讀取中</strong></div>
      <div class="status-row"><span>找到略過按鈕</span><strong id="foundSkipStatus">讀取中</strong></div>
      <div class="status-row"><span>可略過</span><strong id="skipStatus">讀取中</strong></div>
      <div class="status-row"><span>已略過次數</span><strong id="skipCount">0</strong></div>
      <div class="detail-row"><span>按鈕文字</span><p id="skipButtonText">無</p></div>
      <div class="detail-row"><span>符合規則</span><p id="matchedSelector">無</p></div>
      <div class="status-message" id="lastAction">讀取中</div>
      <div class="error-message" id="lastError"></div>
      <div class="checked-time" id="lastSkipAt"></div>
      <div class="checked-time" id="lastCheckedAt"></div>
    </section>

    <section class="card developer-only">
      <label for="intervalInput">檢查間隔（毫秒）</label>
      <input id="intervalInput" type="number" min="300" step="100">
      <button id="saveButton">儲存設定</button>
      <button id="refreshButton" class="secondary">重新偵測</button>
      <p id="saveStatus"></p>
    </section>

    <section class="card developer-only">
      <h2>偵錯 Log</h2>
      <div class="log-actions">
        <button id="refreshLogsButton" class="secondary">重新整理 Log</button>
        <button id="clearLogsButton" class="danger">清除 Log</button>
      </div>
      <textarea id="logOutput" readonly spellcheck="false"></textarea>
    </section>

    <footer class="app-footer user-only">
      <span>功能僅在 YouTube 分頁中運作</span>
      <span id="versionText"></span>
    </footer>
  </main>

  <script src="../config/app-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
